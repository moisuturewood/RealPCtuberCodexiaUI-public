<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealPCtuber Codexia UI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c63f7b'/%3E%3Ccircle cx='24' cy='26' r='6' fill='%23fff'/%3E%3Ccircle cx='42' cy='26' r='6' fill='%23fff'/%3E%3Cpath d='M22 43c7 5 16 5 22 0' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="stage" aria-label="avatar stage">
        <div class="status-strip">
          <span id="connectionDot" class="dot"></span>
          <span id="connectionText">接続中</span>
          <span id="voiceState">待機</span>
        </div>
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" alt="四国めたん" />
        </div>
        <div id="subtitle" class="subtitle">待機しています。</div>
      </section>

      <section class="panel watch-panel" aria-label="codex thread watch">
        <div class="panel-title">スレッド実況</div>
        <form id="watchForm" class="watch-form">
          <label class="field-label" for="threadProfileSelect">履歴から選択</label>
          <select id="threadProfileSelect" aria-label="thread history">
            <option value="">手入力</option>
          </select>
          <label class="field-label" for="threadNameInput">スレッド名</label>
          <input id="threadNameInput" type="text" value="" aria-label="thread name" placeholder="自動取得または任意名" />
          <label class="field-label" for="threadIdInput">スレッドID</label>
          <input id="threadIdInput" type="text" value="" aria-label="thread id" placeholder="thread id" />
          <div class="watch-row">
            <label class="check-row">
              <input id="autoStartWatch" type="checkbox" checked />
              自動開始
            </label>
            <label class="check-row disabled-row">
              <input id="replayRecent" type="checkbox" disabled />
              過去ログなし
            </label>
            <label class="check-row disabled-row">
              <input id="includeTools" type="checkbox" disabled />
              ツール
            </label>
            <button type="submit">開始</button>
            <button id="stopWatch" type="button" class="secondary-button">停止</button>
          </div>
        </form>
        <div id="watchStatus" class="watch-status">未接続</div>
      </section>

      <section class="panel floating-panel" aria-label="floating avatar controls">
        <div class="panel-title">フローティング</div>
        <div class="floating-controls">
          <button id="floatingToggle" type="button">めたんちゃんを出す</button>
          <button id="floatingRecover" type="button" class="secondary-button" title="立ち絵だけを復旧します。音声と実況監視は続きます。" disabled>立ち絵を復旧</button>
          <label class="check-row">
            <input id="floatingSubtitleVisible" type="checkbox" checked />
            字幕
          </label>
          <div id="floatingStatus" class="floating-status">確認中</div>
        </div>
      </section>

      <section class="panel voice-settings-panel" aria-label="voice inference settings">
        <div class="panel-title">音声推論</div>
        <div class="voice-settings-controls">
          <div class="segmented-control" role="radiogroup" aria-label="VOICEVOX推論デバイス">
            <label><input type="radio" name="voicevoxAcceleration" value="auto" checked /><span>自動</span></label>
            <label><input type="radio" name="voicevoxAcceleration" value="cpu" /><span>CPU</span></label>
            <label><input type="radio" name="voicevoxAcceleration" value="gpu" /><span>GPU</span></label>
          </div>
          <div id="voicevoxAccelerationStatus" class="voice-settings-status">自動選択</div>
        </div>
      </section>

      <section class="panel current-panel" aria-label="current speech">
        <div class="panel-title">現在</div>
        <div id="currentText" class="current-text">読み上げ待機中</div>
        <div class="analysis-grid">
          <div>
            <span class="label">感情</span>
            <strong id="emotion">focused</strong>
          </div>
          <div>
            <span class="label">身振り</span>
            <strong id="gesture">idle</strong>
          </div>
          <div>
            <span class="label">口</span>
            <strong id="mouthLayer">-</strong>
          </div>
          <div>
            <span class="label">声</span>
            <strong>四国めたん 2</strong>
          </div>
        </div>
      </section>

      <section class="panel post-panel" aria-label="manual post">
        <div class="panel-title">手動POST</div>
        <form id="postForm" class="post-form">
          <textarea id="postText" rows="4">Elinの移動経路を確認しています。危険な敵を避けながら花拠点へ向かいます。</textarea>
          <div class="post-row">
            <select id="postKind" aria-label="kind">
              <option value="progress">progress</option>
              <option value="success">success</option>
              <option value="warning">warning</option>
              <option value="error">error</option>
              <option value="summary">summary</option>
            </select>
            <button type="submit">送信</button>
          </div>
        </form>
      </section>

      <section class="panel queue-panel" aria-label="speech queue">
        <div class="panel-title">音声キュー</div>
        <ol id="queue" class="queue"></ol>
      </section>

      <section class="panel history-panel" aria-label="event history">
        <div class="panel-title">ログ</div>
        <ol id="history" class="history"></ol>
      </section>

      <section class="panel error-panel" aria-label="last error">
        <div class="panel-title">状態</div>
        <div id="lastError" class="last-error">正常</div>
      </section>
    </main>
    <footer class="app-credit">VOICEVOX:四国めたん</footer>
    <script src="app.js" type="module"></script>
  </body>
</html>
